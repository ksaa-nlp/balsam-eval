[project]
name = "balsam-lm-evaluation"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "certifi~=2026.7.22",
    "evaluate~=0.4.6",
    "google-cloud-speech~=2.40.0",
    "google-cloud-storage~=3.13.1",
    "google-genai~=2.17.0",
    "groq~=1.6.0",
    "jiwer~=4.0.0",
    "librosa~=0.11.0",
    "lm-eval[api]~=0.4.12",
    "numpy>=2.4.6,<2.5",
    "openai~=2.53.0",
    "pillow~=12.3.0",
    "pyarabic~=0.6.15",
    "python-dotenv~=1.2.2",
    "pyyaml~=6.0.3",
    "rapidfuzz~=3.14.5",
    "requests~=2.34.2",
    "rouge-score~=0.1.2",
    "soundfile~=0.14.0",
    "tqdm~=4.70.0",
]

[project.scripts]
balsam-eval = "src.cli:main"

[project.optional-dependencies]
aws = ["boto3~=1.40"]
hf-asr = ["huggingface-hub~=1.27.0"]
hf-chat = ["huggingface-hub~=1.27.0"]
ibm-stt = ["ibm-watson~=11.2.0", "ibm-cloud-sdk-core~=3.26.0"]

[dependency-groups]
dev = [
    "mypy~=2.3.0",
    "pylint[spelling]~=4.0.7",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "pyright~=1.1.411",
    "types-pyyaml~=6.0.12.20260724",
    "types-tqdm~=4.70.0.20260805",
    "types-requests~=2.33.0.20260712",
    "hypothesis~=6.165",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"run.py" = "run.py"

[tool.pytest.ini_options]
pythonpath = [".", "src/"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["^tests/", "_api_models\\.temp\\.py$"]

# Ignore external dependencies that don't have stubs
[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "lm_eval.*",
    "pyarabic.*",
    "evaluate.*",
    "soundfile.*",
    "ibm_watson.*",
    "ibm_cloud_sdk_core.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    ".git",
    "build",
    "dist",
    "ignores",
    "**/_api_models.temp.py",
]
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.pylint.master]
ignore = [".venv",".history",".mypy_cache","build","dist","__pycache__",".pytest_cache",".vscode",".idea",".git",".github",".balsam_eval_cache",".balsam_eval_logs",".balsam_eval_results",".temp","ignores","tests","_api_models.temp.py"]

[tool.pylint.messages_control]
# Disable specific messages for entire project
disable = [
    # Reasonable design choices for this codebase
    "too-many-instance-attributes",  # Data/model classes legitimately need many attributes
    "too-many-arguments",  # Some functions legitimately need many parameters
    "too-many-positional-arguments",  # Some functions legitimately need many positional parameters
    "too-many-branches",  # Complex business logic is hard to split without making it worse
    "too-many-locals",  # Complex functions need local variables for clarity
    "too-many-statements",  # Complex business logic
    "too-many-nested-blocks",  # Complex control flow
    "too-few-public-methods",  # Some classes are primarily data containers
    "protected-access",  # We need to access protected members when working with external libraries
    "global-statement",  # Used for singleton pattern in metrics_registry
    "duplicate-code",  # Adapters intentionally duplicate helpers to stay self-contained/portable
]

# Per-file options for specific cases
[tool.pylint.typecheck]
ignored-modules = []

[tool.pylint.similarities]
ignore-imports = true
min-similarity-lines = 15
